; TWFC VR mod settings
[General]
; Frame rate cap written into the engine (game default 30). 0 = do not touch.
FpsLimit=120
; Cap while the headset is connected. In stereo every game frame renders one eye,
; so the game needs twice the headset refresh rate; the headset paces it.
VRFpsLimit=300

[VR]
Enabled=1
; 0 = theater: the game is always shown on a big virtual screen
; 1 = stereo 3D with head tracking in gameplay, virtual screen in menus and movies
Mode=1
; 0 = third person (game camera + your head), 1 = first person (from the robot's eyes)
CameraMode=0
FirstPersonEyeHeight=180
FirstPersonEyeForward=30
; Unreal units per real metre for head movement
WorldScale=100
; Render a wider view than the headset needs (1.0 = exact)
FovScale=1.0
; 1 = keep the stick-controlled camera pitch (0 = head controls pitch)
KeepStickPitch=0
; Virtual screen for menus and movies (metres)
ScreenDistance=3.0
ScreenWidth=4.0
ScreenHeight=0.0

[Input]
; Feed VR controllers to the game as an Xbox gamepad
VRControllers=1
StickDeadzone=0.15
; Keep the game active when its window is not in front (needed in VR)
AlwaysFocused=1
